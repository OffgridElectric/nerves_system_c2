name: Build Nerves C2 Firmware

on:
  push:
    branches:
      - vj/c2-artifact-test
  pull_request:
    branches:
      - vj/c2-artifact-test
  workflow_dispatch:

jobs:
  build-nerves-c2:
    runs-on: ubuntu-latest
    env:
      CI_GITHUB_USER: vmanchala-dev
      CI_GITHUB_TOKEN: ${{ secrets.CI_GITHUB_TOKEN }}

    steps:
      # Step 1: Checkout your repo
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2: Ensure CI SSH key exists
      - name: Ensure CI SSH key exists
        run: |
          mkdir -p ~/.ssh
          if [ -z "$(ls ~/.ssh/*.pub 2>/dev/null)" ]; then
            ssh-keygen -t ed25519 -N "" -f ~/.ssh/id_ed25519
          fi

      - name: Debug environment
        run: |
          echo "GITHUB USER: $CI_GITHUB_USER"
          echo "GITHUB TOKEN length: ${#CI_GITHUB_TOKEN}"

      # Step 3: Build the C2 Docker image with matching UID/GID
      - name: Build C2 Docker image
        run: |
          export CI_UID=$(id -u)
          export CI_GID=$(id -g)
          docker build \
            --build-arg USER_UID=${CI_UID} \
            --build-arg USER_GID=${CI_GID} \
            -t c2_dev \
            -f docker/Dockerfile.c2 \
            docker

      - name: DEBUG – show actor & real token prefix
        run: |
          echo "Actor(username) : ${{ github.actor }}"
          echo "Token prefix : ${CI_GITHUB_TOKEN:0:6}"
          echo "Token length : ${#CI_GITHUB_TOKEN}"
        env:
          CI_GITHUB_USER: ${{ github.actor }}
          CI_GITHUB_TOKEN: ${{ secrets.CI_GITHUB_TOKEN }}

      - name: DEBUG – check token and insteadOf
        run: |
          docker run --rm -e CI_GITHUB_USER -e CI_GITHUB_TOKEN \
            c2_dev \
            bash -c '
              set -x
              git config --list | grep insteadOf || true
              export GIT_CURL_VERBOSE=1
              echo "Token length: ${#CI_GITHUB_TOKEN}"
              echo "Try real clone:"
              git clone https://${CI_GITHUB_USER}:${CI_GITHUB_TOKEN}@github.com/OffgridElectric/zola_ca.git /tmp/z 2>&1 || true
            '

      # ------------------------------------------------------------------
      # Build firmware inside container
      # ------------------------------------------------------------------
      - name: Run firmware build inside Docker container
        env:
          CI_GITHUB_USER: ${{ github.actor }}          # or secrets.CI_GITHUB_USER
          CI_GITHUB_TOKEN: ${{ secrets.CI_GITHUB_TOKEN }}
        run: |
          chmod +x ./docker/c2_docker_shell.sh
          ./docker/c2_docker_shell.sh \
            "source /work/nerves_system_c2/docker/artifact_build_helper.sh && build"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: firmware-artifacts
          path: artifacts/
