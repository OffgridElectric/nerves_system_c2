name: Build Nerves C2 Firmware

on:
  push:
    branches:
      - vj/c2-artifact-test   # only runs for this branch
  pull_request:
    branches:
      - vj/c2-artifact-test

jobs:
  build-nerves-c2:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout your repo
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2: Set up Docker (comes preinstalled on GitHub runners)
      - name: Build C2 Docker image
        run: |
          chmod +x ./docker/c2_docker_build.sh
          ./docker/c2_docker_build.sh

      # Step 3: Run build inside container using your shell script
      - name: Run firmware build inside Docker container
        run: |
          chmod +x ./docker/c2_docker_shell.sh
          ./docker/c2_docker_shell.sh "source /work/nerves_system_c2/docker/artifact_build_helper_v8.sh && build"

