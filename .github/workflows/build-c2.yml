name: Build Nerves C2 Firmware

on:
  push:
    branches:
      - vj/c2-artifact-test
  pull_request:
    branches:
      - vj/c2-artifact-test

jobs:
  build-nerves-c2:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout your repo
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2: Set up git to use token
      - name: Setup GitHub token for private repository access
        env:
          CI_GITHUB_USER: ${{ secrets.GITHUB_USER }}
          CI_GITHUB_TOKEN: ${{ secrets.CI_GITHUB_TOKEN }}
        run: |
          git config --global url."https://${CI_GITHUB_USER}:${CI_GITHUB_TOKEN}@github.com/".insteadOf "git@github.com:"

      # Step 3: Build the C2 Docker image with matching UID/GID
      - name: Build C2 Docker image
        run: |
          export CI_UID=$(id -u)
          export CI_GID=$(id -g)
          docker build \
            --build-arg USER_UID=${CI_UID} \
            --build-arg USER_GID=${CI_GID} \
            -t c2_dev \
            -f docker/Dockerfile.c2 \
            docker

      # Step 4: Run build inside container using your shell script
      - name: Run firmware build inside Docker container
        run: |
          chmod +x ./docker/c2_docker_shell.sh
          ./docker/c2_docker_shell.sh "source /work/nerves_system_c2/docker/artifact_build_helper.sh && build"
      
      # Step 5: upload the artifatcs
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: firmware-artifacts
          path: artifacts/
